[package]
name = "rcli-agent"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
hex.workspace = true
image.workspace = true
mp4.workspace = true
openh264.workspace = true
rcgen.workspace = true
ring.workspace = true
rcli-protocol.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
bytes.workspace = true
webrtc.workspace = true

# The macOS adapter (`macos.rs`): capture, AX tree, session state and OCR through the system frameworks.
[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6", default-features = false }
libc = "0.2"
objc2 = "0.6"
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "HIServices", "AXError", "AXUIElement", "AXValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGImage", "CGSession"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSString"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "user"] }

# The Linux X11 adapter (`linux/`): capture and RandR over x11rb, input over XTest (enigo), AT-SPI over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = "0.6"
libc = "0.2"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "user", "component"] }
x11rb = { version = "0.13", features = ["randr"] }
zbus = "5"
