[package]
name = "rcli"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# The Agent GUI window; leave off for headless machines (no display libraries).
gui = ["dep:eframe"]
# Live View on the GPU (VideoToolbox on macOS); release builds turn it on, see docs/usage.md.
hwcodec = ["rcli-agent/hwcodec"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
eframe = { workspace = true, optional = true }
hex.workspace = true
rcli-agent.workspace = true
rcli-protocol.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = ["server"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webrtc.workspace = true

# Remembered Device Passwords go to the OS keychain (Keychain, Credential Manager, Secret Service); when the
# keychain is unreachable (a headless Linux Controller, a `--config-dir` test) they stay in the 0600 file fallback.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"
