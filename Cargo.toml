[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/agent", "crates/cli", "crates/testkit"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
mp4 = "0.14"
openh264 = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
rcgen = { version = "0.13", features = ["x509-parser", "pem"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
webrtc = "0.17"

rcli-protocol = { path = "crates/protocol" }
rcli-server = { path = "crates/server" }
rcli-agent = { path = "crates/agent" }
rcli = { path = "crates/cli" }

# Observation encoding is too slow unoptimized for the system tests.
# rcli-agent too: generic image/openh264 code (thumbnail, RGB->YUV) is compiled in the caller's crate.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.rcli-agent]
opt-level = 3

# Password hashing (PBKDF2) is ~10x slower unoptimized; keeps tests fast.
[profile.dev.package.ring]
opt-level = 3
